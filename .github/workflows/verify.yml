name: Verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Host checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          cc --version
          python3 --version
          make --version

      - name: Clean
        run: make clean

      - name: Static and unit checks
        run: make check

      - name: Build baseline
        run: make

  native-amiga:
    name: M3.17 native Amiga compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile native M3 objects with pinned Bebbo toolchain
        run: bash ci/build-native-objects.sh build/native

      - name: Upload native compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3_17-native-amiga
          path: build/native/
          if-no-files-found: warn
